<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Wishlist to Backend</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #4F46E5;
            margin-bottom: 20px;
        }
        button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background: #4338CA;
        }
        button:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        .success {
            background: #D1FAE5;
            color: #065F46;
        }
        .error {
            background: #FEE2E2;
            color: #991B1B;
        }
        .info {
            background: #DBEAFE;
            color: #1E40AF;
        }
        .warning {
            background: #FEF3C7;
            color: #92400E;
        }
        pre {
            background: #F3F4F6;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔄 Sync Wishlist to Backend</h1>
        <p>This tool will sync your local wishlist items to the backend database.</p>
        
        <div id="info" class="status info">
            <strong>Local Wishlist Items:</strong>
            <div id="localItems">Checking...</div>
        </div>

        <button id="syncBtn" onclick="syncWishlist()">Sync to Backend</button>

        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        // Check local wishlist on load
        window.onload = function() {
            const wishlistData = localStorage.getItem('wishlist-storage');
            if (!wishlistData) {
                document.getElementById('localItems').innerHTML = 'No items found in local storage';
                document.getElementById('syncBtn').disabled = true;
                return;
            }

            try {
                const parsed = JSON.parse(wishlistData);
                const items = parsed.state?.items || [];
                
                if (items.length === 0) {
                    document.getElementById('localItems').innerHTML = 'No items in wishlist';
                    document.getElementById('syncBtn').disabled = true;
                } else {
                    document.getElementById('localItems').innerHTML = 
                        `<strong>${items.length} item(s)</strong><br><pre>${JSON.stringify(items, null, 2)}</pre>`;
                }
            } catch (e) {
                document.getElementById('localItems').innerHTML = 'Error reading local storage: ' + e.message;
                document.getElementById('syncBtn').disabled = true;
            }
        };

        async function syncWishlist() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                showResult('error', 'Not logged in! Please login first at <a href="http://localhost:3000/login">http://localhost:3000/login</a>');
                return;
            }

            const wishlistData = localStorage.getItem('wishlist-storage');
            if (!wishlistData) {
                showResult('error', 'No wishlist data found in local storage');
                return;
            }

            try {
                const parsed = JSON.parse(wishlistData);
                const items = parsed.state?.items || [];

                if (items.length === 0) {
                    showResult('warning', 'No items to sync');
                    return;
                }

                showResult('info', `Syncing ${items.length} item(s) to backend...`);
                document.getElementById('syncBtn').disabled = true;

                let successCount = 0;
                let errorCount = 0;
                const errors = [];

                for (const item of items) {
                    try {
                        const response = await fetch(`${API_URL}/wishlist/${item.productId}`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            }
                        });

                        const data = await response.json();

                        if (response.ok || data.error?.code === 'ALREADY_IN_WISHLIST') {
                            successCount++;
                        } else {
                            errorCount++;
                            errors.push(`${item.name}: ${data.error?.message || 'Unknown error'}`);
                        }
                    } catch (error) {
                        errorCount++;
                        errors.push(`${item.name}: ${error.message}`);
                    }
                }

                let resultHTML = `<strong>Sync Complete!</strong><br>`;
                resultHTML += `✓ Successfully synced: ${successCount} item(s)<br>`;
                if (errorCount > 0) {
                    resultHTML += `✗ Failed: ${errorCount} item(s)<br>`;
                    resultHTML += `<pre>${errors.join('\n')}</pre>`;
                }
                resultHTML += `<br><a href="http://localhost:3000/wishlist" style="color: #4F46E5; font-weight: 600;">View Wishlist →</a>`;

                showResult(errorCount === 0 ? 'success' : 'warning', resultHTML);

            } catch (error) {
                showResult('error', 'Error: ' + error.message);
                document.getElementById('syncBtn').disabled = false;
            }
        }

        function showResult(type, message) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'status ' + type;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
